# MRMPL local production tuning. Installed to /etc/postgresql/16/main/conf.d/mrm.conf.
# Sized for a 12 GB WSL VM (16 logical CPUs, SSD) shared with the web app and worker.
listen_addresses = 'localhost'
max_connections = 200

shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 32MB
maintenance_work_mem = 1GB
huge_pages = try

max_worker_processes = 16
max_parallel_workers = 12
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

random_page_cost = 1.1
effective_io_concurrency = 200

wal_buffers = 64MB
min_wal_size = 1GB
max_wal_size = 8GB
checkpoint_completion_target = 0.9
wal_compression = lz4

# Short OLTP queries: JIT compile time costs more than it saves.
jit = off

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on

log_min_duration_statement = 1000
log_checkpoints = on
log_lock_waits = on
