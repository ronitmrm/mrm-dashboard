services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_DB: mrmpl
      POSTGRES_PASSWORD: mrmpl
      POSTGRES_USER: mrmpl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrmpl -d mrmpl"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    volumes:
      - mrmpl_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/001-init-databases.sql:ro

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "6380:6379"
    volumes:
      - mrmpl_redis_data:/data

volumes:
  mrmpl_postgres_data:
  mrmpl_redis_data:
