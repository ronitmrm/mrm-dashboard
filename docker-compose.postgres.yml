services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mrmpl_test
      POSTGRES_PASSWORD: mrmpl
      POSTGRES_USER: mrmpl
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrmpl -d mrmpl_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
